name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_NAME: "Finsocap Dashboard"
          NEXT_PUBLIC_APP_URL: "https://dashboard.finsocap.com"
          NEXT_PUBLIC_API_BASE_URL: "https://finsocap.cloud/api/"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting Frontend Deployment on VPS (Dedicated Isolation)..."
            
            # Isolated frontend deployment directory - does NOT touch backend folders or services
            APP_DIR="${{ secrets.VPS_APP_DIR || '/var/www/finsocap-dashboard' }}"
            
            # Ensure target frontend directory exists
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            echo "📥 Fetching latest dashboard code from GitHub..."
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/finsocap/finsocap.git .
            fi
            
            echo "📦 Installing frontend dependencies..."
            npm ci || npm install
            
            echo "🏗️ Building Next.js application..."
            npm run build
            
            echo "🔄 Managing PM2 Process for finsocap-dashboard (Port 9000)..."
            # Strict PM2 process isolation - only operates on "finsocap-dashboard" without affecting backend APIs
            if pm2 list | grep -q "finsocap-dashboard"; then
              pm2 reload finsocap-dashboard --update-env
            else
              pm2 start npm --name "finsocap-dashboard" -- start
              pm2 save
            fi
            
            echo "✅ Frontend deployment completed successfully! Backend remained completely untouched."

